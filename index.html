<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Woodshed</title>
<style>
:root{
  --bg:#15171c;--surface:#1f2229;--surface2:#282c35;--line:#343945;
  --text:#ecebe7;--muted:#9a9ca3;--accent:#f0a83c;--accent-ink:#1b1408;
  --good:#6cc28a;--danger:#e0675f;--empty:#2c3039;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:650}
h2{font-size:1.25rem}h3{font-size:1rem;display:flex;align-items:center;gap:8px}
small,.muted{color:var(--muted)}
.grow{flex:1;min-width:0}
header#top{position:sticky;top:0;z-index:20;background:rgba(21,23,28,.94);backdrop-filter:blur(8px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
#syncDot{font-size:.85rem;padding:2px 4px}
#syncDot.bad{color:var(--danger)}
header#top .logo{font-weight:750;letter-spacing:.02em;color:var(--accent)}
header#top select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;width:auto;max-width:min(45vw,220px)}
#sessbar{display:none;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);padding:8px 16px;font-weight:650;position:sticky;top:57px;z-index:19}
#sessbar.on{display:flex}
#sessbar button{background:rgba(0,0,0,.15);border:0;border-radius:8px;padding:5px 10px;font-weight:650;color:inherit}
main{padding:14px 16px;max-width:720px;margin:0 auto}
.card{background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin-bottom:10px}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;padding:14px;font-size:1.05rem;margin-top:10px}
.btn.ghost{background:none;border-style:dashed;color:var(--muted);width:100%;margin-top:8px}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:.9rem}
.iconbtn{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:4px 8px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
input[type=number],input[type=text],input[type=search],input[type=date],select,textarea{
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:block;margin:10px 0 4px;color:var(--muted);font-size:.9rem}

/* level */
.lvl{display:flex;gap:12px;align-items:center}
.lvbadge{background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:12px;padding:10px 12px;min-width:64px;text-align:center}
.bar{height:10px;background:var(--empty);border-radius:6px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}

/* week */
.week{display:flex;justify-content:space-between;gap:6px;margin:4px 0 10px}
.week div{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
.week b{display:block;margin:4px auto 0;width:30px;height:30px;border-radius:50%;background:var(--empty);line-height:30px;color:var(--accent-ink)}
.week b.on{background:var(--accent)}
.week b.today{outline:2px solid var(--muted);outline-offset:2px}
.stats3{display:flex;gap:10px}
.stats3 div{flex:1;background:var(--surface2);border-radius:10px;padding:8px 10px}
.stats3 strong{display:block;font-size:1.25rem}

/* heatmap */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;grid-auto-columns:1fr}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--empty)}
.heat i.l1{background:#5a4320}.heat i.l2{background:#93682a}.heat i.l3{background:#c98d34}.heat i.l4{background:#f3b34a}
.heat i.fut{background:transparent}

/* plan */
.plan{list-style:none;margin:0;padding:0}
.plan li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.8rem}
.plan .chk.on{background:var(--good);border-color:var(--good);color:#0d2416}
.plan button.item{all:unset;flex:1;cursor:pointer}
.plan .tag{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* exercises */
details.sec{background:var(--surface);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.sec summary{list-style:none;padding:14px;display:flex;gap:10px;align-items:center;cursor:pointer}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary:before{content:"▸";color:var(--muted);transition:transform .15s}
details.sec[open] summary:before{transform:rotate(90deg)}
details.sec .body{padding:0 10px 10px}
.exrow{all:unset;display:block;width:100%;box-sizing:border-box;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer}
.exrow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.exrow .meta{font-size:.85rem;color:var(--muted);white-space:nowrap}
.exrow .meta b{color:var(--accent)}
.strip{display:flex;gap:3px;margin-top:6px}
.strip i{flex:1;height:8px;border-radius:3px;background:var(--empty)}
.strip i.fl{outline:1.5px solid var(--text)}
.donebadge{font-size:.75rem;background:var(--good);color:#0d2416;border-radius:6px;padding:1px 6px;margin-left:6px}

/* key entry */
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:600px){.keys{grid-template-columns:1fr 1fr 1fr}}
.krow{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:10px;padding:6px 8px;border:1.5px solid transparent}
.krow.fl{border-color:var(--accent)}
.krow .kn{width:40px;font-weight:650;font-size:.95rem;flex:none}
.krow .kn small{display:block;font-weight:400;font-size:.7rem}
.krow input{padding:7px 2px;text-align:center;background:var(--bg);min-width:0;flex:1;font-size:1.05rem;font-weight:600}
.krow .iconbtn{padding:4px 2px}
.krow .ubtn{color:var(--text);padding:4px 1px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.krow .sw{width:8px;align-self:stretch;border-radius:4px;flex:none}
.keys.one{grid-template-columns:1fr}
.floorbox{display:flex;gap:10px;margin:10px 0}
.floorbox div{flex:1;background:var(--surface2);border-radius:10px;padding:8px 10px}
.floorbox strong{font-size:1.4rem;display:block}

/* licks & tunes */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lcard{all:unset;cursor:pointer;background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.lcard .im{background:#fff;height:80px;display:grid;place-items:center;color:#888;font-size:.8rem;overflow:hidden}
.lcard .im img{width:100%;height:100%;object-fit:cover;object-position:left center}
.lcard .t{padding:8px 10px;display:flex;justify-content:space-between;gap:6px}
.lickimg{background:#fff;border-radius:10px;width:100%;display:block;margin:8px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;white-space:nowrap;font-size:.9rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.trow{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;background:var(--surface);border-radius:12px;padding:12px;margin-bottom:8px}
.pips{display:flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--empty)}
.pips i.on{background:var(--accent)}
.pips i.w{background:linear-gradient(90deg,var(--accent) 50%,var(--empty) 50%)}
.lvl3{display:flex;gap:4px}
.lvl3 button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px;font-size:.8rem;color:var(--muted)}
.lvl3 button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.stage{background:var(--surface2);border-radius:10px;padding:10px;margin-bottom:6px}
.stage b{display:block;margin-bottom:6px}
.tagchip{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:4px 6px 4px 10px;margin:0 6px 6px 0;font-size:.9rem}
.tagchip button{background:none;border:0;color:var(--muted);padding:0 4px}
.stages label{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface2);border-radius:10px;margin-bottom:6px}
.stages input{width:20px;height:20px;accent-color:var(--accent)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bdg{background:var(--surface2);border-radius:12px;padding:10px 6px;text-align:center;font-size:.78rem;color:var(--muted)}
.bdg .ic{font-size:1.6rem;display:block;filter:grayscale(1);opacity:.35}
.bdg.on{color:var(--text)}
.bdg.on .ic{filter:none;opacity:1}
.bdg b{display:block;font-size:.82rem;color:inherit}

/* lists */
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}

/* nav */
nav#tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav#tabs button{flex:1;background:none;border:0;padding:9px 0 10px;color:var(--muted);font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav#tabs button span{font-size:1.25rem;line-height:1}
nav#tabs button.on{color:var(--accent)}

/* metronome */
#metro{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:50;background:var(--surface2);border:1px solid var(--line);
  border-radius:16px;padding:8px 10px;display:none;align-items:center;gap:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:520px;margin:0 auto}
#metro.on{display:flex}
#metro input{width:56px;text-align:center;font-weight:700;font-size:1.1rem;padding:6px}
#metro .beat{width:12px;height:12px;border-radius:50%;background:var(--empty);flex:none}
#metro .beat.hit{background:var(--accent)}
#metro button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 6px;font-weight:650;font-size:.85rem;min-width:30px}
#metro{gap:4px!important;padding:8px 6px!important}
#metro button.play{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:44px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
#sheet .phead{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);opacity:0;transition:.25s;z-index:60;background:var(--accent);
  color:var(--accent-ink);font-weight:650;border-radius:12px;padding:10px 16px;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
#cele{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.celeBox{position:relative;overflow:hidden;background:var(--surface);border-radius:20px;padding:24px 20px 16px;max-width:400px;width:100%;text-align:center;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.celeItem{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:8px}
.celeItem>span{font-size:1.7rem}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2s ease-in forwards;opacity:.9}
@keyframes fall{to{top:110%;transform:rotate(540deg)}}
.recapHead{position:relative;text-align:center;padding:10px 0 6px}
.chdone{border:1px solid var(--good)}
.stats3 small{display:block}
.chart{font-size:.92rem;margin:4px 0}
.crow{display:grid;grid-template-columns:repeat(4,1fr);border-left:2px solid var(--line)}
.cbar{position:relative;border-right:2px solid var(--line);border-bottom:1px solid var(--line);padding:15px 4px 6px;min-height:48px}
.cbar.off{border-right:0;border-bottom:0}
.cn{position:absolute;top:1px;right:3px;font-size:.6rem;color:var(--muted)}
.csec{position:absolute;top:2px;left:3px;font-size:.62rem;background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 3px;font-weight:700}
.cend{position:absolute;top:1px;left:22px;font-size:.65rem;color:var(--accent);font-weight:700}
.cch{font-weight:600;word-break:break-word;line-height:1.25}
.crep{color:var(--muted);font-weight:400;margin:0 2px}
.cbar.sel{background:rgba(240,168,60,.18)}
#qfree .cbar{cursor:pointer}
.qgap{display:inline-block;border:1.5px dashed var(--accent);color:var(--accent);border-radius:5px;padding:0 6px;font-weight:800;cursor:pointer}
.qq{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 7px;font-weight:800}
.qh{color:var(--muted)}
.qok{color:var(--good)}.qno{color:var(--danger);text-decoration:line-through;text-decoration-thickness:1px}
.qfb .qno{text-decoration:none}
.qfb{min-height:1.6em;margin:8px 0;font-size:1.05rem}
.qroots,.qfams{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:6px}
.qfams{grid-template-columns:repeat(3,1fr)}
.qroots button,.qfams button,.earopts button{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:10px 2px;font-weight:650}
.qroots button{line-height:1.15;padding:7px 2px;font-size:.92rem}
.qroots button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.earopts{display:grid;gap:8px;margin-top:12px}
.earopts button{padding:13px 10px;text-align:left}
.earopts button.right{background:var(--good);color:#0d2416}.earopts button.wrong{background:var(--danger);color:#fff}
.cprow{display:flex;align-items:center;gap:10px;padding:7px 2px}
.cprow input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.duebadge{font-size:.7rem;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 6px;vertical-align:1px}
th.cph{font-size:.7rem;font-weight:500;color:var(--muted)}
.rhbox{background:var(--surface2);border-radius:12px;padding:6px;max-height:46vh;overflow-y:auto}
.rhline+.rhline{margin-top:4px}
.rhpad{width:100%;height:150px;margin-top:12px;border-radius:16px;border:2px dashed var(--line);background:var(--surface2);font-size:1.4rem;font-weight:800;color:var(--muted);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.rhpad.hit{background:var(--accent);color:var(--accent-ink)}
.nt{height:1.05em;width:.6em;vertical-align:-.18em;margin-right:1px}
body.metro-on #sheet .panel{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button.krow{width:100%;border:0;text-align:left}
main.wide{max-width:1280px}
.gwrap{overflow-x:auto;margin-bottom:10px}
table.grid{border-collapse:collapse;font-size:.9rem}
table.grid th{text-align:left;font-weight:500;padding:4px 8px 4px 0;white-space:nowrap;color:var(--muted)}
table.grid thead th{text-align:center;color:var(--text);font-weight:650}
table.grid td{padding:2px}
table.grid td.gc{white-space:nowrap}
.cuw{display:inline-block;width:14px}
.cu{padding:0;color:var(--accent)}
table.grid td input[type=text],table.grid td input[type=number]{width:56px;padding:6px 4px;text-align:center}
table.grid td.fl{padding-left:10px;white-space:nowrap;color:var(--accent);font-weight:650}
table.grid input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);display:block;margin:0 auto}
.sp{height:10px}
</style>
</head>
<body>
<header id="top">
  <div class="logo">♪ Woodshed</div>
  <button class="iconbtn" id="syncDot" data-act="syncNow" title="Cloud sync"></button>
  <div class="grow"></div>
  <button class="iconbtn" data-act="metroToggle" title="Metronome">♩</button>
  <select id="instSel" aria-label="Instrument"></select>
</header>
<div id="sessbar"><span>● Session</span><span id="sessTime">0:00</span><div class="grow"></div>
  <button data-act="pauseSession" id="pauseBtn">Pause</button><button data-act="finishSession">Finish</button></div>
<main id="view"></main>
<div id="metro">
  <span class="beat" id="beat"></span>
  <button data-act="mStep" data-d="-5">−5</button>
  <button data-act="mStep" data-d="-1">−1</button>
  <input id="mBpm" type="number" inputmode="numeric" min="20" max="400" value="120" aria-label="Metronome BPM">
  <button data-act="mStep" data-d="1">+1</button>
  <button data-act="mStep" data-d="5">+5</button>
  <button data-act="mTap">Tap</button>
  <button class="play" data-act="mPlay" id="mPlay">▶</button>
  <div class="grow"></div>
  <button data-act="metroToggle" aria-label="Close metronome">✕</button>
</div>
<nav id="tabs">
  <button data-tab="home" class="on"><span>⌂</span>Home</button>
  <button data-tab="ex"><span>♯</span>Exercises</button>
  <button data-tab="licks"><span>♫</span>Licks</button>
  <button data-tab="tunes"><span>♬</span>Tunes</button>
  <button data-tab="train"><span>🎧</span>Train</button>
  <button data-tab="more"><span>★</span>Progress</button>
</nav>
<div id="sheet"><div class="bk" data-act="closeSheet"></div><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<div id="cele" class="hide"><div class="celeBox"><div id="celeConf" class="conf"></div><div style="font-size:2.6rem">🎉</div><div id="celeBody"></div><button class="btn primary big" data-act="celeOk">Nice!</button></div></div>
<input type="file" id="fileIn" accept="image/*" class="hide">
<input type="file" id="importIn" accept="application/json,.json" class="hide">

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const slug = s => s.toLowerCase().replace(/#/g, 's').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const DAY = 864e5;
const dayKey = d => { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const monday = d => { d = new Date(d); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; };
const addDays = (d, n) => { d = new Date(d); d.setDate(d.getDate() + n); return d; };
const ago = t => { if (!t) return ''; const d = Math.floor((Date.now() - t) / DAY); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d < 7 ? d + 'd ago' : d < 60 ? Math.floor(d / 7) + 'w ago' : Math.floor(d / 30) + 'mo ago'; };
const fmtMin = m => m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------- key sets & default library ---------- */
const MAJ = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

function migrate() {
  S.libRev = S.libRev || 1;

    LICK_SRC.forEach((src, i) => {
      const id = 'lick-' + (i + 1); let l = S.lib.licks.find(x => x.id === id);
      if (!l) { l = { id, name: 'Lick ' + (i + 1), img: null, notes: '' }; S.lib.licks.push(l); }
      if (!l.img) l.img = 'licks/' + id + '.png';

      let t = S.lib.tunes.find(x => x.id === slug(name) || x.name.toLowerCase() === name.toLowerCase());
      if (!t) { t = { id: slug(name), name, tags: '' }; S.lib.tunes.push(t); }
      t.style = t.style || style; t.composer = t.composer || composer;

    }
    S.lib.tunes.sort((a, b) => a.name.localeCompare(b.name));
    S.libRev = 2;
  }
  if (S.libRev < 3) {
    for (const l of S.lib.licks) delete l.src;
    for (const t of S.lib.tunes) t.tags = splitTags(t.tags).filter(x => x !== 'favorites').join(', ');
    // old 5 checkboxes (Listened, Melody, Changes, Memorized, Soloing) -> 3 stages with levels
    for (const id in S.prog) for (const tid in S.prog[id].tunes || {}) {
      const o = S.prog[id].tunes[tid]; if (!o.st) continue;

    S.libRev = 4;
  }
  if (S.libRev < 5) {
    // Triplet and triad exercises default to half-note tempo (16th-note arpeggios excepted). Only where no unit was chosen yet.
    for (const sec of S.lib.sections) for (const ex of sec.ex) {
      const match = /triplet|triad/i.test(ex.name) || /triplet/i.test(sec.name);
      if (ex.unit == null && match && !/16ths/i.test(ex.name)) ex.unit = 2;

  }

    for (const id in S.prog) { const tunes = S.prog[id].tunes || {}, count = {};

      const bulk = new Set(Object.entries(count).filter(([, n]) => n >= 3).map(([ts]) => +ts));

    let sec = S.lib.sections.find(x => x.id === 'diminished-scale' || x.name.toLowerCase() === 'diminished scale');

/* ---------- images (IndexedDB) ---------- */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('woodshed', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('img');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('img', mode); const req = fn(t.objectStore('img'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); }); };
  return { get: k => tx('readonly', s => s.get(k)), put: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)),
    all: () => tx('readonly', s => s.getAllKeys()) };
})();
const imgCache = {};
async function hydrateImgs(root = document) {
  for (const el of $$('img[data-img]', root)) {
    const id = el.dataset.img; if (!id) continue;
    if (id.includes('/')) { el.src = id; continue; }
    if (!(id in imgCache)) { try { imgCache[id] = await idb.get(id); } catch (e) { imgCache[id] = null; } }
    if (imgCache[id]) el.src = imgCache[id];
  }
}
function fileToDataURL(file, max = 1800) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
function pickImage() {
  return new Promise(res => { const f = $('#fileIn'); f.value = ''; f.onchange = async () => { res(f.files[0] ? await fileToDataURL(f.files[0]) : null); }; f.click(); });
}

const Sync = (() => {

    const remote = JSON.parse(await fileText(f));

    if (!force && (S.savedAt || 0) <= (cfg.pushedAt || 0)) return;

          if (confirm(`Found Woodshed data in ${user.login}'s GitHub, saved ${new Date(remote.savedAt).toLocaleString()}.\n\nOK = load it onto this device (replaces what's here)\nCancel = upload this device's data instead`)) await applyRemote(remote, g);
          else { S.savedAt = Date.now(); save(true); await push(true); }

  v.innerHTML = tab === 'home' ? vHome() : tab === 'ex' ? vEx() : tab === 'grid' ? vGrid() : tab === 'licks' ? vLicks() : tab === 'tunes' ? vTunes() : tab === 'train' ? vTrain() : vMore();
  v.classList.toggle('wide', tab === 'grid');
  if (tab === 'grid') bindGrid();
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === (tab === 'grid' ? 'ex' : tab)));
  $('#instSel').innerHTML = S.inst.map(i => `<option value="${i.id}" ${i.id === S.cur ? 'selected' : ''}>${esc(i.name)}</option>`).join('');
  if (tab === 'licks') hydrateImgs(v);
  if (tab === 'ex') {
    const f = $('#exFilter'); f.value = exFilterVal; applyExFilter();
    f.oninput = () => { exFilterVal = f.value; applyExFilter(); };
    $$('details.sec').forEach(d => d.addEventListener('toggle', () => d.open ? openSecs.add(d.dataset.sec) : openSecs.delete(d.dataset.sec)));
  }
  if (tab === 'train') { const r = $('#rhBpm'); if (r) { r.oninput = () => { $('#rhBpmV').textContent = r.value; }; r.onchange = () => { S.settings.rhBpm = +r.value; save(true); }; } }
  if (tab === 'more') {
    const setPrior = () => { P().priorHours = priorFrom($('#priorH').value, $('#priorM').value); save(); checkBadges(); render(); };
    $('#priorH').onchange = setPrior; $('#priorM').onchange = setPrior;
    $$('[data-plansz]').forEach(sel => sel.onchange = () => { S.settings.plan = Object.assign(planSize(), { [sel.dataset.plansz]: +sel.value }); S.plan = null; save(); });
    const sf = $('#syncForm'); if (sf) sf.onsubmit = async e => { e.preventDefault(); const t = $('#syncToken').value.trim(); if (!t) return; sf.querySelector('button').disabled = true; await Sync.connect(t); render(); };
    $('#drumsChk').onchange = e => { S.settings.drums = e.target.checked; save(); };
    $('#minGoalSel').onchange = e => { S.settings.minGoal = +e.target.value; save(); checkAchievements({ silent: true }); render(); };
    $('#celeChk').onchange = e => { S.settings.celeSound = e.target.checked; save(); };
    $('#goalSel').onchange = e => { S.settings.goal = +e.target.value; save(); checkBadges(); render(); };
  }
}
let exFilterVal = '';
function applyExFilter() {
  const q = exFilterVal.trim().toLowerCase();
  $$('details.sec').forEach(d => {
    const secName = d.querySelector('summary b').textContent.toLowerCase();
    let any = false;
    $$('.exrow', d).forEach(r => { const hit = !q || r.dataset.name.includes(q) || secName.includes(q); r.classList.toggle('hide', !hit); any = any || hit; });
    d.classList.toggle('hide', !any); if (q && any) d.open = true;
  });
}

let sheetOpen = false, sheetOnClose = null;
function openSheet(html, onClose) {
  $('#panel').innerHTML = html; $('#sheet').classList.add('on'); $('#panel').scrollTop = 0;
  if (!sheetOpen) history.pushState({ sheet: 1 }, ''); sheetOpen = true; sheetOnClose = onClose || null;
  hydrateImgs($('#panel'));

function closeSheet(fromPop) {

const head = (title, sub) => `<div class="phead"><div class="grow"><h2>${esc(title)}</h2>${sub ? `<small>${esc(sub)}</small>` : ''}</div><button class="iconbtn" data-act="closeSheet" aria-label="Close">✕</button></div>`;

function tempoChart(series, u = 1) {
  if (series.length < 2) return '';
  const W = 300, H = 90, t0 = series[0].t, t1 = series[series.length - 1].t || t0 + 1, lo = Math.min(...series.map(x => x.bpm)) - 5, hi = Math.max(...series.map(x => x.bpm)) + 5;
  const X = t => 8 + (W - 16) * (t - t0) / Math.max(1, t1 - t0), Y = b => H - 14 - (H - 24) * (b - lo) / Math.max(1, hi - lo);
  const pts = series.map(x => `${X(x.t).toFixed(1)},${Y(x.bpm).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:6px"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${series.map(x => `<circle cx="${X(x.t).toFixed(1)}" cy="${Y(x.bpm).toFixed(1)}" r="3" fill="var(--accent)"/>`).join('')}
    <text x="4" y="${H - 2}" fill="var(--muted)" font-size="10">${new Date(t0).toLocaleDateString()}</text><text x="${W - 4}" y="${H - 2}" fill="var(--muted)" font-size="10" text-anchor="end">${Math.round(series[series.length - 1].bpm / u)}${u === 2 ? ' (half notes)' : ' bpm'}</text></svg>`;
}
function histList(prefix, labelFn) {
  const all = P().hist.filter(x => x.k.startsWith(prefix));
  const h = all.slice(-12).reverse();
  if (!h.length) return '';
  const single = new Set(all.map(x => x.k)).size === 1;
  return `<h3 style="margin:14px 0 6px">Tempo history</h3>${single ? tempoChart(all, uk(all[0].k)) : ''}<ul class="list">${h.map(x => `<li><span class="grow">${esc(labelFn(x.k))}</span><small>${new Date(x.t).toLocaleDateString()}</small><b style="color:${x.prev != null && x.bpm > x.prev ? 'var(--accent)' : 'var(--text)'}">${x.prev != null ? `<small>${dv(x.k, x.prev)}→</small>` : ''}${Tk(x.k, x.bpm)}</b></li>`).join('')}</ul>`;
}

      <textarea name="txt" rows="8" style="font-family:monospace">${esc(txt)}</textarea><label class="f">Key</label><select name="k">${[...MAJOR_KEYS, ...MINOR_KEYS].map(k => `<option ${c && k === c.k ? 'selected' : ''}>${k}</option>`).join('')}</select>`,
      fd => { const b = parseCustomChart(fd.txt); if (!b.length) { toast('No chords found'); return false; } t.custom = { k: fd.k, ts: '4/4', b }; save(); toast(b.length + ' bars saved'); setTimeout(() => openTuneSheet(t.id, { chart: true }), 0); }); },
  quizPick: () => loadLibrary().then(quizPickSheet).catch(() => toast('Could not load charts – are you offline?')),
  quizStart: el => loadLibrary().then(() => quizSetup(el.dataset.id)).catch(() => toast('Could not load charts – are you offline?')),
  quizGo: el => { const lv = ($('#panel input[name=ql]:checked') || {}).value || 'key'; S.settings.quizLevel = lv; save(true);
    let ch = chartFor(el.dataset.id); if (!ch) { toast('No chart'); return; }
    const ks = $('#qKey').value; S.settings.quizKey = ks === 'random' ? 'random' : 'orig';
    if (ks === 'random') { const keys = (isMinorKey(ch.key) ? MINOR_KEYS : MAJOR_KEYS).filter(k => k !== ch.key); ch = transposeChart(ch, keys[Math.floor(Math.random() * keys.length)]); }
    else if (ks !== 'orig') ch = transposeChart(ch, ks);
    const slots = quizSlots(ch), want = QUIZ_LEVELS[lv], idx = {};
    slots.forEach((sl, i) => idx[sl.bi + ':' + sl.ci] = i);
    Q = { vid: el.dataset.id, ch, slots, idx, level: lv, ask: slots.map((sl, i) => want.includes(sl.imp) ? i : -1).filter(i => i >= 0), pos: 0, res: {}, pick: null, fb: '' };
    Q.hear = $('#qHear').checked; S.settings.quizHear = Q.hear; Q.roman = S.settings.quizAns === 'roman'; Q.transposed = ks !== 'orig'; save(true);
    if (S.settings.quizMode === 'free') { Q.mode = 'free'; Q.askSet = new Set(Q.ask); Q.len = S.settings.quizLen || 4; Q.target = Q.ask[0]; Q.win = Q.slots[Q.ask[0]]?.bi || 0; }
    startTrain('quiz'); if (!Q.ask.length) { toast('Nothing to ask at this level'); return; } quizRender();
    if (Q.mode === 'free') { if (Q.hear) quizPlayBars(Q.win, Q.win + Q.len); } else quizPlay(0, Q.ask[0]); },
  quizAns: el => { S.settings.quizAns = el.dataset.v; save(true); quizSetup(QS.vid); },
  quizMode: el => { S.settings.quizMode = el.dataset.m; save(true); quizSetup(QS.vid); },
  quizLen: el => { S.settings.quizLen = +el.dataset.n; save(true); quizSetup(QS.vid); },
  quizSlot: (el, e) => { e.stopPropagation(); const si = +el.dataset.si; if (Q.res[si] != null) return; Q.target = si; Q.win = Q.slots[si].bi; quizRender(); if (Q.hear) quizPlayBars(Q.win, Q.win + Q.len); },
  quizPlayWin: () => quizPlayBars(Q.win, Q.win + Q.len),
  // Speaker button: play the chord being asked for, with the chord before it as a lead-in.
  quizReplay: () => { if (Q.mode === 'free') { quizPlayBars(Q.win, Q.win + Q.len); return; }
    if (Q.pos >= Q.ask.length) { if (Q.lastPlay?.length) playChords(Q.lastPlay, 120); return; }
    const cur = Q.ask[Q.pos], list = [];
    for (let i = Math.max(0, cur - 1); i <= cur; i++) { const sl = Q.slots[i], b = Q.ch.bars[sl.bi]; list.push({ sym: transposeSym(sl.x, Q.ch.toConcert, false), beats: 4 / b.c.length }); }
    playChords(list, 120); },
  quizRoot: el => { Q.pick = +el.dataset.pc; $$('#panel .qroots button').forEach(b => b.classList.toggle('on', +b.dataset.pc === Q.pick)); },
  quizFam: el => { if (Q.pick == null) { toast('Pick the root first'); return; } Q.mode === 'free' ? quizAnswerFree(Q.pick, el.dataset.f) : quizAnswer(Q.pick, el.dataset.f); },
  quizReveal: () => Q.mode === 'free' ? quizAnswerFree(null, null) : quizAnswer(null, null),
  quizEnd: () => { if (Q.mode === 'free') { Q.ask = Q.ask.filter(i => Q.res[i] != null); Q.askSet = new Set(Q.ask); } else Q.ask = Q.ask.slice(0, Q.pos); quizFinish(); quizRender(); },
  earStart: el => { EG.n = 0; startTrain('ear'); const go = () => { earNew(el.dataset.k); EG.played = false; earSheet(); };
    if (el.dataset.k === 'tune') loadLibrary().then(go).catch(() => toast('Could not load charts – are you offline?')); else go(); },
  earPlay: () => { EG.played = true; playChords(EG.chords, EG.bpm, { drums: EG.kind !== 'qual', bpb: EG.kind === 'tune' ? EG.bpb : 4 }); const b = $('#panel [data-act=earPlay]'); if (b) b.textContent = '▶ Play again'; },
  earPlayMine: () => { if (EG.kind === 'tune') { const t = S.lib.tunes.find(x => x.name === EG.answered), e = t && libEntry(t); if (!e) return;
      const part = earPart(e, EG.partPick); playChords(barsToChords(part.bars, t.custom ? TO_CONCERT[instTr()] : 3, beatsPerBar(e)), styleTempo(e.s), { bpb: beatsPerBar(e) }); toast('Playing ' + part.name + ' of ' + t.name); return; }
    if (EG.kind === 'prog') playChords(progChords(EG.answered, EG.key), EG.bpm); else playChords([{ sym: pcName(EG.root, false) + EG.answered, beats: 4 }], EG.bpm, { drums: false }); },
  earAnswer: el => { if (EG.answered != null) return; EG.answered = el.dataset.v; trainScore(EG.answered === EG.answer, EG.kind); earSheet(); },
  earNext: () => { earNew(EG.kind); EG.played = false; earSheet(); setTimeout(() => A.earPlay(), 150); },
  trainSet: el => { const v = el.dataset.v; S.settings[el.dataset.k] = /^\d+$/.test(v) ? +v : v; save(true); render(); },
  rhStart: () => { startTrain('rhythm'); rhNew(); },
  rhNext: () => rhNew(),
  rhGo: () => rhRun(false),
  rhListen: () => rhRun(true),
  rhTap: () => {},
  tagDel: el => { const t = S.lib.tunes.find(x => x.id === el.dataset.id); t.tags = splitTags(t.tags).filter(x => x !== el.dataset.tag).join(', '); save(); sheetTune.refresh(); },
  pickKey: el => { const o = findEx(el.dataset.id); const k = el.dataset.k || weakestKey(o.ex); addToPlan({ t: 'ex', id: o.ex.id, key: k }); closeSheet(); },
  tuneFilter: el => { tuneFilter = el.dataset.f; render(); },
  practiced: el => { const o = findEx(el.dataset.ex); o.ex.keys.forEach(k => { const inp = $(`#panel input[data-key="${CSS.escape(exKey(o.ex, k))}"]`); if (inp && inp.value) touch(exKey(o.ex, k), o.ex.id); }); P().touched['x:' + o.ex.id] = Date.now(); save(); toast('Marked practiced'); },
  practicedItem: el => { touch(el.dataset.k); save(); toast('Marked practiced'); },
  startSession: () => { S.session = { acc: 0, runSince: Date.now(), start: Date.now(), items: [] }; save(); keepAwake(); tickSession(); render(); toast('Session started – have fun!'); },
  pauseSession: () => { const s = S.session; if (s.runSince) { s.acc += Date.now() - s.runSince; s.runSince = null; if (wakeLock) wakeLock.release().catch(() => {}); } else { s.runSince = Date.now(); keepAwake(); } save(); tickSession(); },
  finishSession: () => {
    const min = Math.max(1, Math.round(sessMs() / 60000)); const s = S.session;
    formSheet('Finish session', `<p class="muted">${s.items.length} item${s.items.length === 1 ? '' : 's'} worked on.</p>
      <label class="f">Minutes</label><input type="number" inputmode="numeric" name="min" value="${min}" min="1">
      <label class="f">Note (optional)</label><input type="text" name="note" placeholder="How did it go?">`,
      fd => { const m = Math.round(+fd.min); if (!(m > 0)) { toast('Enter minutes'); return false; }
        S.session = null; save(); if (wakeLock) wakeLock.release().catch(() => {}); tickSession(); setTimeout(() => saveSessionRecord(s.start, m, fd.note, s.items), 80); },
      `<button type="button" class="btn ghost danger" data-act="discardSession">Discard session</button>`);
  },
  discardSession: () => { if (confirm('Discard this session without saving?')) { S.session = null; save(); tickSession(); closeSheet(); } },
  logPast: () => formSheet('Log past session', `<label class="f">Date</label><input type="date" name="d" value="${dayKey(Date.now())}" max="${dayKey(Date.now())}">
      <label class="f">Minutes</label><input type="number" inputmode="numeric" name="min" min="1" placeholder="45"><label class="f">Note</label><input type="text" name="note">`,
    fd => { const m = Math.round(+fd.min); if (!(m > 0) || !fd.d) { toast('Enter date and minutes'); return false; } const [y, mo, d] = fd.d.split('-').map(Number);
      setTimeout(() => saveSessionRecord(new Date(y, mo - 1, d, 12).getTime(), m, fd.note), 80); }),
  delSession: el => { if (!confirm('Delete this session?')) return; const p = P(); p.sessions = p.sessions.filter(s => s.id !== el.dataset.id); save(); render(); },
  addSec: () => formSheet('New category', `<label class="f">Name</label><input type="text" name="name" required>`, fd => { const n = fd.name.trim(); if (!n) return false;
    S.lib.sections.push({ id: slug(n) + '-' + uid(), name: n, ex: [] }); save(); }),
  editSec: el => { const sec = S.lib.sections.find(s => s.id === el.dataset.sec);
    formSheet('Edit category', `<label class="f">Name</label><input type="text" name="name" value="${esc(sec.name)}" required>`, fd => { sec.name = fd.name.trim() || sec.name; save(); },
      `<button type="button" class="btn ghost danger" data-act="delSec" data-sec="${esc(sec.id)}">Delete category</button>`); },
  delSec: el => { const sec = S.lib.sections.find(s => s.id === el.dataset.sec); if (!confirm(`Delete "${sec.name}" and its ${sec.ex.length} exercises? Logged tempos are kept in backups but hidden.`)) return;
    S.lib.sections = S.lib.sections.filter(s => s !== sec); save(); closeSheet(); },
  addEx: el => { const sec = S.lib.sections.find(s => s.id === el.dataset.sec);
    formSheet('New exercise in ' + sec.name, `<label class="f">Name</label><input type="text" name="name" required placeholder="e.g. Up & down – 8ths">${keysetFields(null)}`,
      fd => { const n = fd.name.trim(); const keys = keysFrom(fd); if (!n || !keys.length) return false; sec.ex.push({ id: slug(sec.name + ' ' + n) + '-' + uid(), name: n, keys }); openSecs.add(sec.id); save(); }); },
  editEx: el => { const { sec, ex } = findEx(el.dataset.id);
    formSheet('Edit exercise', `<label class="f">Name</label><input type="text" name="name" value="${esc(ex.name)}" required>${keysetFields(ex.keys)}
      <p class="muted" style="font-size:.85rem">Tempos for keys you remove stay in backups but won't show.</p>`,
      fd => { ex.name = fd.name.trim() || ex.name; const k = keysFrom(fd); if (k.length) ex.keys = k; save(); },
      `<button type="button" class="btn ghost danger" data-act="delEx" data-id="${esc(ex.id)}">Delete exercise</button>`); },
  delEx: el => { const { sec, ex } = findEx(el.dataset.id); if (!confirm(`Delete "${ex.name}"?`)) return; sec.ex = sec.ex.filter(x => x !== ex); save(); closeSheet(); },
  addLick: () => formSheet('New lick', `<label class="f">Name</label><input type="text" name="name" required value="Lick ${S.lib.licks.length + 1}">
      <p class="muted" style="font-size:.9rem">You can add a photo or screenshot of the notation next.</p>`,
    fd => { const l = { id: 'lick-' + uid(), name: fd.name.trim() || 'Lick', img: null, notes: '', unit: 2 }; S.lib.licks.push(l); save(); setTimeout(() => sheetLick(l.id), 0); }),
  lickImg: async el => { const l = S.lib.licks.find(x => x.id === el.dataset.id); const data = await pickImage(); if (!data) return;
    const id = 'img-' + uid(); try { await idb.put(id, data); } catch (e) { toast('Could not store image'); return; }
    if (l.img && !l.img.includes('/')) idb.del(l.img).catch(() => {}); l.img = id; imgCache[id] = data; save(); sheetLick(l.id); },
  renameLick: el => { const l = S.lib.licks.find(x => x.id === el.dataset.id); const n = prompt('Lick name', l.name); if (n && n.trim()) { l.name = n.trim(); save(); sheetLick(l.id); } },
  delLick: el => { const l = S.lib.licks.find(x => x.id === el.dataset.id); if (!confirm(`Delete "${l.name}"?`)) return; if (l.img && !l.img.includes('/')) idb.del(l.img).catch(() => {});
    S.lib.licks = S.lib.licks.filter(x => x !== l); save(); closeSheet(); },
  addTune: () => { loadLibrary().catch(() => {}).finally(() => formSheet('New tune', `<label class="f">Name</label><input type="text" name="name" required list="libList" placeholder="Start typing – charts are looked up automatically">
      <datalist id="libList">${(LIB || []).map(e => `<option value="${esc(e.t)}">`).join('')}</datalist>
      <label class="f">Tags (comma separated)</label><input type="text" name="tags" placeholder="e.g. standard, ballad">
      <div class="stages" style="margin-top:10px"><label><input type="checkbox" name="tempo"><span class="grow">Tempo tune – track BPM</span></label></div>`,
    fd => { const n = fd.name.trim(); if (!n) return false; const e = LIB && LIB.byNorm.get(normT(n));
      const t = { id: slug(n) + '-' + uid(), name: e ? e.t : n, tags: splitTags(fd.tags).join(', '), tempo: !!fd.tempo, chart: e ? e.t : null };
      if (e) { t.style = e.s; t.composer = e.c; }
      S.lib.tunes.push(t); S.lib.tunes.sort((a, b) => a.name.localeCompare(b.name)); save();
      toast(e ? 'Chart found ✓' : 'No chart found – you can type the changes in'); setTimeout(() => openTuneSheet(t.id), 0); })); },
  renameTune: el => { const t = S.lib.tunes.find(x => x.id === el.dataset.id); const n = prompt('Tune name', t.name); if (n && n.trim()) { t.name = n.trim(); save(); openTuneSheet(t.id); } },
  delTune: el => { const t = S.lib.tunes.find(x => x.id === el.dataset.id); if (!confirm(`Delete "${t.name}"?`)) return; versionsOf(t).forEach(v => delete P().tunes[v]); S.lib.tunes = S.lib.tunes.filter(x => x !== t); save(); closeSheet(); },
  addInst: () => formSheet('New instrument', `<label class="f">Name</label><input type="text" name="name" required placeholder="e.g. Tenor sax">
      <label class="f">Practice time on it so far</label>${priorFields(0)}
      <label class="f">Reads in</label><select name="tr"><option value="Eb">E♭ (alto, baritone sax)</option><option value="Bb">B♭ (tenor, soprano sax, trumpet, clarinet)</option><option value="C">C (concert: flute, piano, guitar…)</option></select>
      <p class="muted" style="font-size:.9rem">Uses the same exercises, licks and tunes, with its own tempos, sessions and badges.</p>`,
    fd => { const n = fd.name.trim(); if (!n) return false; const id = slug(n) + '-' + uid(); S.inst.push({ id, name: n, tr: fd.tr || 'Eb' }); S.prog[id] = Object.assign(newProg(), { priorHours: priorFrom(fd.ph, fd.pm) }); S.cur = id; S.plan = null; save(); checkBadges(); toast('Switched to ' + n); }),
  renameInst: el => { const i = S.inst.find(x => x.id === el.dataset.id); const n = prompt('Instrument name', i.name); if (n && n.trim()) { i.name = n.trim(); save(); render(); } },
  delInst: el => { const i = S.inst.find(x => x.id === el.dataset.id); if (prompt(`This deletes all progress for ${i.name}. Type DELETE to confirm.`) !== 'DELETE') return;
    S.inst = S.inst.filter(x => x !== i); delete S.prog[i.id]; if (S.cur === i.id) S.cur = S.inst[0].id; S.plan = null; save(); render(); },
  exportData: async () => {
    const imgs = {}; for (const l of S.lib.licks) if (l.img && !l.img.includes('/')) { try { imgs[l.img] = await idb.get(l.img); } catch (e) {} }
    S.settings.lastBackup = Date.now(); save();
    const blob = new Blob([JSON.stringify({ app: 'woodshed', v: 1, exported: new Date().toISOString(), state: S, imgs })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'woodshed-backup-' + dayKey(Date.now()) + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000); render();
  },
  importData: () => { const f = $('#importIn'); f.value = ''; f.onchange = async () => {
    try { const d = JSON.parse(await f.files[0].text()); if (d.app !== 'woodshed' || !d.state || !d.state.lib) throw 0;
      if (!confirm('Replace everything on this device with this backup?')) return;
      for (const [k, v] of Object.entries(d.imgs || {})) if (v) await idb.put(k, v);
      S = d.state; S.session = null; localStorage.setItem(LS, JSON.stringify(S)); load(); render(); toast('Backup restored');
    } catch (e) { toast('That file is not a Woodshed backup'); } }; f.click(); },
  metroToggle: () => mShow(!$('#metro').classList.contains('on')),
  mOpen: (el, e) => { e.preventDefault(); const inp = el.closest('.krow, .row')?.querySelector('input'); const b = (inp && inp.value) || el.dataset.bpm; if (b) mSet(b); mShow(true); if (!M.on) mStart(); },
  mStep: el => { mSet(M.bpm + +el.dataset.d); },
  mPlay: () => M.on ? mStop() : mStart(),
  mTap: () => { const now = performance.now(); M.taps = M.taps.filter(t => now - t < 2500); M.taps.push(now);
    if (M.taps.length >= 2) { const iv = (M.taps[M.taps.length - 1] - M.taps[0]) / (M.taps.length - 1); mSet(60000 / iv); } },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; if (sheetOpen) closeSheet(); render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest('[data-act]'); if (!a || !A[a.dataset.act]) return;
  A[a.dataset.act](a, e);
});
document.addEventListener('keydown', e => { if (RH.timer && !RH.listen && !e.repeat && sheetOpen) { e.preventDefault(); rhTap(); } });
// pointerdown on the pad: lower latency than click
document.addEventListener('pointerdown', e => { if (e.target.closest('#rhPad')) { e.preventDefault(); rhTap(); } });
$('#instSel').addEventListener('change', e => { S.cur = e.target.value; S.plan = null; save(); render(); toast('Now tracking ' + curInst().name); });

/* ---------- boot ---------- */
load();
checkBadges(true);
render(); tickSession(); Sync.paint(); Sync.now();
// Load the chart library in the background so tunes get linked to their charts.
setTimeout(() => loadLibrary().then(() => { if (tab === 'tunes' && !sheetOpen) render(); }).catch(() => {}), 300);
if (S.session && S.session.runSince) keepAwake();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
