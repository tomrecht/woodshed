<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limber has moved</title>
<style>body{background:#15171c;color:#e8eaef;font:16px system-ui,sans-serif;text-align:center;padding:40px 16px}a{color:#5fd38d}</style>
<p>Limber has moved to <a href="/limber/">tomrecht.github.io/limber</a>.</p>
<script>
// Retire this old address: drop its service worker (keeping all caches – the new app shares this origin), then forward.
(navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]))
  .then(rs => Promise.all(rs.filter(r => new URL(r.scope).pathname === '/woodshed/limber/').map(r => r.unregister())))
  .catch(() => {}).then(() => location.replace('/limber/'));
</script>
